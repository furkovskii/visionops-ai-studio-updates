<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VisionOps Hesabım</title><style>
:root{color-scheme:dark;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:#07111e;color:#ecf6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top right,#11404a,transparent 55%),#07111e;display:grid;place-items:center;padding:28px}.panel{max-width:460px;width:100%;background:#101f31;border:1px solid #2b4a5d;border-radius:20px;padding:36px;box-shadow:0 25px 70px #0007}.logo{font-size:24px;font-weight:750;color:#e9f5fa}.logo b{color:#34d7cf}h1{font-size:31px;letter-spacing:-1px;margin:28px 0 8px}p{color:#9db7c8;line-height:1.6}label{display:block;color:#bcd0dc;font-size:13px;margin-top:17px;margin-bottom:7px}input{width:100%;padding:14px;background:#0a1928;color:white;border:1px solid #385363;border-radius:10px;font-size:15px}button{width:100%;margin-top:23px;padding:15px;font-weight:750;background:#2cdbd1;color:#052429;border:0;border-radius:10px;cursor:pointer}.link{display:block;margin-top:17px;border:0;background:transparent;color:#5ee2d7;padding:6px;font-size:13px;cursor:pointer;text-align:center;width:100%}.message{margin-top:17px;background:#153442;border:1px solid #346174;color:#c5f4ee;padding:12px;border-radius:10px;font-size:13px;line-height:1.5}.hidden{display:none}.back{color:#8eacbc;display:inline-block;margin-bottom:24px;font-size:13px}
</style></head><body><div class="panel"><a class="back" href="./">← VisionOps ana sayfa</a><div class="logo"><b>V</b> VisionOps <span style="font-weight:400">AI Studio</span></div><h1 id="heading">Hesabınıza giriş yapın</h1><p id="intro">Aynı bulut hesabını VisionOps masaüstü uygulamasında da kullanabilirsiniz.</p><form id="form"><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Parola</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"><button id="submit">Giriş Yap</button></form><button class="link" id="toggle">Hesabım yok, ücretsiz hesap oluştur</button><div class="message hidden" id="message" role="status"></div><div id="account" class="hidden"><h2>Hesabınız</h2><p id="accountEmail"></p><p id="licenses"></p><button id="logout">Çıkış Yap</button></div><p style="font-size:12px">Şu an ödeme alınmıyor. Hesap oluşturmak otomatik olarak ücretli ürün erişimi vermez. Kamera görüntüsü bu sayfaya yüklenmez.</p></div><script>
'use strict';
const URL='https://uozderqllvhuiaquulhg.supabase.co';
const KEY='sb_publishable_UynYBjWSFYyR4Samj6PeXA_gBD8OmCu';
let signup=false,token=null;
const e=id=>document.getElementById(id);
function msg(t){e('message').textContent=t;e('message').classList.remove('hidden')}
e('toggle').onclick=()=>{signup=!signup;e('heading').textContent=signup?'Hesap oluşturun':'Hesabınıza giriş yapın';e('submit').textContent=signup?'Ücretsiz Hesap Oluştur':'Giriş Yap';e('toggle').textContent=signup?'Zaten hesabım var, giriş yap':'Hesabım yok, ücretsiz hesap oluştur';e('password').autocomplete=signup?'new-password':'current-password';e('message').classList.add('hidden')};
e('form').onsubmit=async ev=>{ev.preventDefault();e('submit').disabled=true;let body={email:e('email').value.trim(),password:e('password').value};try{let endpoint=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';let res=await fetch(URL+endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});let d=await res.json();if(!res.ok)throw Error(d.msg||d.message||d.error_description||'Giriş başarısız');e('password').value='';if(signup){msg('Kayıt alındı. E-postanıza doğrulama gönderildiyse hesabı doğrulayın, ardından giriş yapın.');return}if(!d.access_token)throw Error('Oturum anahtarı bulunamadı');token=d.access_token;e('form').classList.add('hidden');e('toggle').classList.add('hidden');e('account').classList.remove('hidden');e('accountEmail').textContent=d.user?.email||'';e('message').classList.add('hidden');let resp=await fetch(URL+'/rest/v1/visionops_entitlements?select=module_code,status,expires_at',{headers:{'apikey':KEY,'Authorization':'Bearer '+token}});if(!resp.ok)throw Error('Paket bilgisi okunamadı');let grants=await resp.json();let active=grants.filter(g=>g.status==='active'&&(!g.expires_at||Date.parse(g.expires_at)>Date.now()));e('licenses').textContent=active.length?'Aktif modüller: '+active.map(x=>x.module_code.toUpperCase()).join(', '):'Henüz aktif modül erişiminiz bulunmuyor.';}catch(err){msg(err.message||'Bağlantı hatası')}finally{e('submit').disabled=false}};
e('logout').onclick=()=>{token=null;e('account').classList.add('hidden');e('form').classList.remove('hidden');e('toggle').classList.remove('hidden');msg('Yerel web oturumu kapatıldı.');};
</script></body></html>
