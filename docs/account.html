<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VisionOps Hesabım</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');:root{font-family:'DM Sans',system-ui,sans-serif;background:#f7f4ed;color:#203334}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#d9efe5,transparent 38%),#f7f4ed;display:grid;place-items:center;padding:30px}.panel{width:100%;max-width:480px;background:#fffefa;border-radius:22px;border:1px solid #dce4da;padding:38px;box-shadow:0 30px 65px #41655b20}.logo{font-family:'Space Grotesk',system-ui;font-weight:700;letter-spacing:-1px;font-size:25px}.logo b{color:#119c8e}h1{font-family:'Space Grotesk',system-ui;font-size:34px;letter-spacing:-1.3px;line-height:1.15;margin:29px 0 10px}h2{font-family:'Space Grotesk',system-ui}p{color:#6b8080;line-height:1.7;font-size:14px}label{font-weight:700;font-size:12px;display:block;margin-top:20px;margin-bottom:8px;color:#405e60}input{width:100%;background:white;border:1px solid #c6d7d0;border-radius:11px;padding:14px 15px;font:inherit;color:#172f32;outline:none}input:focus{border-color:#2ec6b5;box-shadow:0 0 0 3px #2ec6b520}button{width:100%;margin-top:25px;background:#137d73;color:white;border:0;padding:14px;border-radius:11px;font-weight:800;cursor:pointer;font-size:14px}button:hover{background:#0c6158}.link{margin-top:18px;color:#087f78;background:transparent;padding:5px;font-size:13px}.message{margin-top:19px;padding:14px;background:#e7f4ed;color:#175d50;border-radius:10px;font-size:13px;line-height:1.5;border:1px solid #c3e1d6}.hidden{display:none}.back{font-size:13px;color:#59716a;text-decoration:none;display:inline-block;margin-bottom:25px}</style></head><body><div class="panel"><a class="back" href="./">← VisionOps ana sayfa</a><div class="logo"><b>V</b> VisionOps <span style="font-weight:400">AI Studio</span></div><h1 id="heading">Hesabınıza giriş yapın</h1><p id="intro">Aynı bulut hesabını VisionOps masaüstü uygulamasında da kullanabilirsiniz.</p><form id="form"><label for="email">E-posta adresi</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Parola</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128"><button id="submit">Giriş Yap</button></form><button class="link" id="toggle">Hesabım yok, ücretsiz hesap oluştur</button><div class="message hidden" id="message" role="status"></div><div id="account" class="hidden"><h2>Hesabınız</h2><p id="accountEmail"></p><p id="licenses"></p><button id="logout">Çıkış Yap</button></div><p style="font-size:12px">Şu an ödeme alınmıyor. Hesap oluşturmak otomatik olarak ücretli ürün erişimi vermez. Kamera görüntüsü bu sayfaya yüklenmez.</p></div><script>
'use strict';
const URL='https://uozderqllvhuiaquulhg.supabase.co';
const KEY='sb_publishable_UynYBjWSFYyR4Samj6PeXA_gBD8OmCu';
let signup=false,token=null;
const e=id=>document.getElementById(id);
function msg(t){e('message').textContent=t;e('message').classList.remove('hidden')}
e('toggle').onclick=()=>{signup=!signup;e('heading').textContent=signup?'Hesap oluşturun':'Hesabınıza giriş yapın';e('submit').textContent=signup?'Ücretsiz Hesap Oluştur':'Giriş Yap';e('toggle').textContent=signup?'Zaten hesabım var, giriş yap':'Hesabım yok, ücretsiz hesap oluştur';e('password').autocomplete=signup?'new-password':'current-password';e('message').classList.add('hidden')};
e('form').onsubmit=async ev=>{ev.preventDefault();e('submit').disabled=true;let body={email:e('email').value.trim(),password:e('password').value};try{let endpoint=signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password';let res=await fetch(URL+endpoint,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(body)});let d=await res.json();if(!res.ok)throw Error(d.msg||d.message||d.error_description||'Giriş başarısız');e('password').value='';if(signup){msg('Kayıt alındı. E-postanıza doğrulama gönderildiyse hesabı doğrulayın, ardından giriş yapın.');return}if(!d.access_token)throw Error('Oturum anahtarı bulunamadı');token=d.access_token;e('form').classList.add('hidden');e('toggle').classList.add('hidden');e('account').classList.remove('hidden');e('accountEmail').textContent=d.user?.email||'';e('message').classList.add('hidden');let resp=await fetch(URL+'/rest/v1/visionops_entitlements?select=module_code,status,expires_at',{headers:{'apikey':KEY,'Authorization':'Bearer '+token}});if(!resp.ok)throw Error('Paket bilgisi okunamadı');let grants=await resp.json();let active=grants.filter(g=>g.status==='active'&&(!g.expires_at||Date.parse(g.expires_at)>Date.now()));e('licenses').textContent=active.length?'Aktif modüller: '+active.map(x=>x.module_code.toUpperCase()).join(', '):'Henüz aktif modül erişiminiz bulunmuyor.';}catch(err){msg(err.message||'Bağlantı hatası')}finally{e('submit').disabled=false}};
e('logout').onclick=()=>{token=null;e('account').classList.add('hidden');e('form').classList.remove('hidden');e('toggle').classList.remove('hidden');msg('Yerel web oturumu kapatıldı.');};
</script></body></html>
