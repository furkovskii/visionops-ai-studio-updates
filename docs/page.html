<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionOps | Sayfa</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:#1d3c3d;font:16px "DM Sans",system-ui,sans-serif}nav{height:85px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfe8df;padding:0 max(24px,calc((100vw - 1160px)/2))}.brand{font:bold 24px "Space Grotesk",sans-serif;text-decoration:none;color:#213d40}.brand b{color:#0f9487}.back{color:#0f8176;text-decoration:none;font-size:14px;font-weight:700}main{max-width:1150px;margin:70px auto;padding:0 25px 120px}h1{font:700 clamp(35px,5vw,64px) "Space Grotesk";letter-spacing:-2px}.lead{color:#6d8881;line-height:1.8}.blocks{display:flex;flex-direction:column;gap:19px;margin-top:45px}.visionops-block{background:#fff;border:1px solid #e0e6df;border-radius:15px;padding:25px;overflow-wrap:anywhere}.visionops-block[data-kind=heading]{font:700 38px "Space Grotesk"}.visionops-block[data-kind=paragraph]{font-size:18px;line-height:1.75}.visionops-block[data-kind=button]{background:transparent!important;border:0;padding:0;align-self:start}.custom-button{display:inline-flex;padding:14px 24px;color:white;background:#10867a;border-radius:10px;text-decoration:none;font-weight:800}.visionops-block img{max-width:100%;height:auto;border-radius:10px}.visionops-block[data-kind=divider]{padding:0;border:0;border-top:1px solid #cbded4}.note{color:#779087;font-size:13px}</style></head><body><nav><a href="./" class="brand"><b>V</b> VisionOps AI Studio</a><a href="./" class="back">← Ana sayfa</a></nav><main><div style="font-size:12px;letter-spacing:2px;color:#10877d;font-weight:800">VISIONOPS / SAYFALAR</div><h1 id="page-title">Sayfa yükleniyor…</h1><p class="lead">VisionOps ekibi tarafından hazırlanan içerikler.</p><section id="visionops-custom-blocks" class="blocks"></section><p class="note">Yalnızca yayımlanmış sayfalar görüntülenebilir.</p></main><script>
(async()=>{const BASE='https://uozderqllvhuiaquulhg.supabase.co',KEY='sb_publishable_UynYBjWSFYyR4Samj6PeXA_gBD8OmCu';let slug=new URLSearchParams(location.search).get('slug')||'';if(!/^[a-z0-9-]{2,40}$/.test(slug)||slug==='home'){document.getElementById('page-title').textContent='Geçersiz sayfa';return}
async function fetchRows(path){const r=await fetch(BASE+'/rest/v1/'+path,{headers:{apikey:KEY}});if(!r.ok)throw Error('Sayfa yüklenemiyor');return r.json()}
try{const pages=await fetchRows('visionops_site_pages?select=slug,title&slug=eq.'+encodeURIComponent(slug));if(!pages.length)throw Error('Sayfa bulunamadı');document.getElementById('page-title').textContent=pages[0].title;document.title=pages[0].title+' | VisionOps';
const blocks=await fetchRows('visionops_site_blocks?select=kind,content,url,background,foreground&order=sort_order.asc&page_slug=eq.'+encodeURIComponent(slug));
const host=document.getElementById('visionops-custom-blocks');for(const b of blocks){const node=document.createElement('article');node.className='visionops-block';node.dataset.kind=b.kind;if(/^#[\da-f]{6}$/i.test(b.background||''))node.style.background=b.background;if(/^#[\da-f]{6}$/i.test(b.foreground||''))node.style.color=b.foreground;
if(['heading','paragraph','card'].includes(b.kind))node.textContent=b.content||'';
if(b.kind==='button'&&(/^https:\/\//.test(b.url||'')||(/^\/[^/]/.test(b.url||'')))){const a=document.createElement('a');a.className='custom-button';a.href=b.url;a.textContent=b.content||'Bağlantı';a.rel='noopener noreferrer';node.append(a)}
if(b.kind==='image'&&/^https:\/\//.test(b.url||'')){const img=document.createElement('img');img.src=b.url;img.loading='lazy';img.alt=b.content||'Görsel';node.append(img)}
host.append(node)}}catch(err){document.getElementById('page-title').textContent=err.message}
})();
</script></body></html>
