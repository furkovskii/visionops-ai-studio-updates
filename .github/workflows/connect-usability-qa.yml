name: VisionOps Connect v0.13.5 guided setup QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/connect-usability/**'
      - '.github/workflows/connect-usability-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild v0.13.5 from pinned tested v0.13.4 foundation
        run: python qa/connect-usability/build.py
      - name: Verify automatic local scan, hidden Windows console and in-app help
        run: python qa/connect-usability/test_usability.py
      - name: Validate onboarding JavaScript syntax
        shell: bash
        run: node --check - < qa/connect-usability/wizard.js.inc
      - name: Install isolated browser simulation
        run: npm install --no-save --ignore-scripts jsdom@26.1.0
      - name: Exercise real wizard click paths in test browser
        run: node qa/connect-usability/test_wizard.mjs
      - name: Install live decoder fixture dependencies on Windows
        if: runner.os == 'Windows'
        run: python -m pip install numpy opencv-python
      - name: Simulate four camera streams, dropped connection and recovery
        if: runner.os == 'Windows'
        run: python qa/connect-usability/test_decoder.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: VisionOps-Connect-v0.13.5-QA
          path: |
            connect-usability-build/VisionOps_AI_Studio_update.zip
            connect-usability-build/VisionOps_AI_Studio_Setup.zip
          if-no-files-found: error
          retention-days: 14
