name: SceneFlow deterministic rule and proof QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/sceneflow/**'
      - '.github/workflows/sceneflow-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Exercise SceneFlow, TruthMeter and ActionLab boundaries
        run: python qa/sceneflow/test_sceneflow.py
