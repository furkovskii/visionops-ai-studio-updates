name: VisionOps 0.13.7 SceneFlow integrated desktop QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'qa/sceneflow-live/**'
      - '.github/workflows/sceneflow-live-qa.yml'
      - '.github/workflows/publish-visionops.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild verified 0.13.6 base and SceneFlow integrated 0.13.7
        run: python qa/sceneflow-live/build.py
      - name: Exercise SceneFlow integration and isolation regression
        run: python qa/sceneflow-live/test_live.py
      - name: Reverify independent observation rule contract
        run: python qa/sceneflow/test_sceneflow.py
      - name: Check generated inline JavaScript
        shell: bash
        run: |
          node --check - < qa/sceneflow-live/live-ui.js.inc
          node --check - < qa/sceneflow-desktop/preview.js.inc
      - name: Recheck four-stream camera recovery on Windows
        if: runner.os == 'Windows'
        run: |
          python -m pip install numpy opencv-python
          python qa/connect-usability/test_decoder.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: SceneFlow-integrated-0.13.7-Windows-QA
          path: |
            sceneflow-live-build/VisionOps_AI_Studio_update.zip
            sceneflow-live-build/VisionOps_AI_Studio_Setup.zip
          retention-days: 14
          if-no-files-found: error
